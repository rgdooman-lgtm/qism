<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تطبيق قسَم المطور</title>
    <style>
        :root { --main: #00adb5; --bg: #121212; --panel: #1e1e1e; --text: #eeeeee; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body, html { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
        
        /* شاشة تسجيل الدخول */
        #login { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .login-box { background: var(--panel); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-box h2 { color: var(--main); margin-bottom: 20px; }
        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #333; border-radius: 8px; background: #2d2d2d; color: #fff; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--main); border: 0; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        #err { color: #ff4a4a; font-size: 14px; margin-top: 10px; }

        /* شاشة التطبيق الرئيسية والغرف */
        #chat-app { display: none; height: 100%; flex-direction: column; }
        header { background: linear-gradient(135deg, var(--main), #007a80); color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        header span.logout { cursor: pointer; font-size: 14px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 5px; }
        
        .main-container { display: flex; flex: 1; height: calc(100% - 54px); overflow: hidden; }
        
        /* قائمة غرف الدول العربية */
        #rooms-sidebar { width: 30%; background: var(--panel); border-left: 1px solid #333; overflow-y: auto; display: flex; flex-direction: column; }
        .room-item { padding: 15px; border-bottom: 1px solid #2d2d2d; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .room-item:hover, .room-item.active { background: #2d2d2d; color: var(--main); }
        .room-status { font-size: 12px; padding: 2px 6px; border-radius: 4px; }
        .status-open { background: #2e7d32; color: #fff; }
        .status-closed { background: #c62828; color: #fff; }

        /* منطقة الدردشة والرسائل */
        #chat-zone { width: 70%; display: flex; flex-direction: column; background: #161616; position: relative; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 75%; padding: 10px; border-radius: 12px; background: #2d2d2d; align-self: flex-start; word-break: break-word; position: relative; }
        .msg.me { align-self: flex-end; background: var(--main); color: #fff; }
        .msg-user { font-size: 12px; font-weight: bold; margin-bottom: 3px; opacity: 0.8; }
        .msg-img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .msg-seen { font-size: 10px; text-align: left; opacity: 0.6; margin-top: 4px; display: block; }

        /* منطقة الإدخال وأزرار التحكم والأدمن */
        #admin-panel { background: #222; padding: 10px; border-bottom: 1px solid #333; display: none; justify-content: space-between; align-items: center; }
        #input-area { padding: 12px; background: var(--panel); display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        #fileInput { display: none; }
        .attach-btn { background: #444; color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        
        /* العملات والهدايا */
        #coins-badge { background: #ffd700; color: #000; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول وإنشاء الحساب -->
    <div id="login">
        <div class="login-box">
            <h2>تطبيق قسَم المطور</h2>
            <input type="text" id="nameInput" placeholder="اسم المستخدم أو الإيميل">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button id="startBtn">دخول / تسجيل حساب جديد</button>
            <div id="err"></div>
        </div>
    </div>

    <!-- 2. الشاشة الرئيسية للتطبيق (الغرف والدردشة) -->
    <div id="chat-app">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="app-title">غرف قسَم العربية</span>
                <span id="coins-badge">🪙 0 عملة</span>
            </div>
            <span class="logout" id="logoutBtn">خروج</span>
        </header>
        
        <div class="main-container">
            <!-- قائمة الغرف العربية -->
            <div id="rooms-sidebar"></div>
            
            <!-- منطقة المحادثة الحية -->
            <div id="chat-zone">
                <!-- لوحة تحكم الأدمن والمسؤولين داخل الغرفة -->
                <div id="admin-panel">
                    <span id="admin-info">لوحة الإشراف للغرفة</span>
                    <button id="toggleRoomBtn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 13px;">قفل / فتح الغرفة</button>
                </div>
                
                <!-- عرض الرسائل والصور المرفوعة -->
                <div id="messages"></div>
                
                <!-- حقل الإرسال (إرسال صور فقط بناءً على طلبك) -->
                <div id="input-area">
                    <label for="fileInput" class="attach-btn">📷 اضغط لإرسال صورة فقط</label>
                    <input type="file" id="fileInput" accept="image/*">
                    <div id="uploadStatus" style="font-size: 14px; opacity: 0.7;"></div>
                </div>
            </div>
        </div>
    </div>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://gstatic.com";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, arrayUnion } from "https://gstatic.com";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://gstatic.com";

  // إعدادات Firebase الخاصة بك
  const firebaseConfig = {
    apiKey: "AIzaSyDmEv98dCo20qf0vdtDxPC...", // الكود الموضح في صورتك
    authDomain: "://firebaseapp.com",
    projectId: "qism-chat-2026-merwan",
    storageBucket: "://appspot.com",
    messagingSenderId: "413614575776",
    appId: "1:413614575776:web:20cb34166b122665ed19c5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let currentUid = null;
  let currentUsername = "";
  let currentUserRole = "user"; // الرتب: user, room_admin, super_admin
  let currentRoomId = "Saudi"; // الغرفة الافتراضية عند البدء
  let unsubscribeMessages = null;

  // قائمة الدول العربية المعتمدة في النظام
  const arabicCountries = [
    { id: "Saudi", name: "المملكة العربية السعودية" },
    { id: "Egypt", name: "جمهورية مصر العربية" },
    { id: "Iraq", name: "العراق" },
    { id: "Algeria", name: "الجزائر" },
    { id: "Morocco", name: "المغرب" },
    { id: "Tunisia", name: "تونس" },
    { id: "Jordan", name: "الأردن" },
    { id: "Lebanon", name: "لبنان" },
    { id: "Syria", name: "سوريا" },
    { id: "Emirates", name: "الإمارات" }
  ];

  // زر الدخول والتسجيل المشترك
  $("startBtn").onclick = async () => {
    const inputName = $("nameInput").value.trim();
    const password = $("passInput").value.trim();

    if (!inputName || !password) {
      $("err").textContent = "يرجى إدخال الاسم وكلمة السر!";
      return;
    }

    // لتبسيط عملية الدخول بالاسم، نقوم بإنشاء بريد إلكتروني تلقائي خلفي في الـ Firebase
    const email = inputName.includes("@") ? inputName : `${inputName}@qism.com`;

    try {
      // محاولة تسجيل الدخول
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      await loadUserAndBootstrap(userCredential.user.uid);
    } catch (error) {
      // إذا كان الحساب جديد وغير مسجل، يتم إنشاؤه تلقائياً
      if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const uid = userCredential.user.uid;
          
          // تحديد صلاحية حسابك كأدمن عام إذا كتبت الاسم "الأدمن العام" على سبيل المثال
          let role = "user";
          if (inputName === "الأدمن العام" || inputName === "admin") { role = "super_admin"; }

          // إنشاء ملف المستخدم في قاعدة البيانات بـ 0 عملة افتراضية
          await setDoc(doc(db, "users", uid), {
            username: inputName,
            role: role,
            coins: 100, // رصيد ترحيبي للشراء
            createdAt: serverTimestamp()
          });

          await loadUserAndBootstrap(uid);
        } catch (createError) {
          $("err").textContent = "فشل إنشاء الحساب الجديد: " + createError.message;
        }
      } else {
        $("err").textContent = "خطأ في الاتصال: " + error.message;
      }
    }
  };

  // جلب البيانات الأساسية للمستخدم وتشغيل النظام والدخول للغرف
  async function loadUserAndBootstrap(uid) {
    const userDoc = await getDoc(doc(db, "users", uid));
    if (userDoc.exists()) {
      const data = userDoc.data();
      currentUid = uid;
